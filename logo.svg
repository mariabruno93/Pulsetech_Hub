<svg viewBox="0 0 500 520" width="500" height="520"
  xmlns="http://www.w3.org/2000/svg"
  role="img" aria-label="Pulse Tech Hub Logo">
  <title>Pulse Tech Hub</title>

  <defs>
    <!-- Glow filters -->
    <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g3" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="txt-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Background gradient: deep black with a warm ember at center -->
    <radialGradient id="bg" cx="50%" cy="43%" r="52%">
      <stop offset="0%"   stop-color="#0e0100"/>
      <stop offset="70%"  stop-color="#050000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- LED sphere gradient -->
    <radialGradient id="led-sphere" cx="38%" cy="34%" r="68%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="20%"  stop-color="#ffddcc"/>
      <stop offset="50%"  stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#880000"/>
    </radialGradient>

    <!-- Text gradient: white to slightly warm -->
    <linearGradient id="txt-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dddddd"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="500" height="520" fill="url(#bg)"/>

  <!-- ── Outermost ring (very faint, dashed orbit) ── -->
  <circle cx="250" cy="210" r="190"
    fill="none" stroke="#280400" stroke-width="1"
    stroke-dasharray="2 11"/>

  <!-- ── Second orbit ── -->
  <circle cx="250" cy="210" r="158"
    fill="none" stroke="#1c0300" stroke-width="0.8"
    stroke-dasharray="6 14"/>

  <!-- ── Hexagon frame ── -->
  <polygon
    points="250,80 345,135 345,245 250,300 155,245 155,135"
    fill="none" stroke="#3a0700" stroke-width="1.5"/>

  <!-- hex vertex dots -->
  <circle cx="250" cy="80"  r="2.5" fill="#550900"/>
  <circle cx="345" cy="135" r="2.5" fill="#550900"/>
  <circle cx="345" cy="245" r="2.5" fill="#550900"/>
  <circle cx="250" cy="300" r="2.5" fill="#550900"/>
  <circle cx="155" cy="245" r="2.5" fill="#550900"/>
  <circle cx="155" cy="135" r="2.5" fill="#550900"/>

  <!-- ── Inner dashed ring ── -->
  <circle cx="250" cy="210" r="86"
    fill="none" stroke="#2e0500" stroke-width="1"
    stroke-dasharray="3 8"/>

  <!-- ── PCB arms (N / S / E / W) ── -->
  <!-- North -->
  <line x1="250" y1="124" x2="250" y2="78" stroke="#771200" stroke-width="1.5"/>
  <rect x="243" y="67" width="14" height="14" rx="1"
    fill="#3d0800" stroke="#771200" stroke-width="1.2"/>
  <circle cx="250" cy="124" r="2.5" fill="#991800"/>

  <!-- South -->
  <line x1="250" y1="296" x2="250" y2="362" stroke="#771200" stroke-width="1.5"/>
  <rect x="243" y="362" width="14" height="14" rx="1"
    fill="#3d0800" stroke="#771200" stroke-width="1.2"/>
  <circle cx="250" cy="296" r="2.5" fill="#991800"/>

  <!-- East -->
  <line x1="336" y1="210" x2="402" y2="210" stroke="#771200" stroke-width="1.5"/>
  <rect x="402" y="203" width="14" height="14" rx="1"
    fill="#3d0800" stroke="#771200" stroke-width="1.2"/>
  <circle cx="336" cy="210" r="2.5" fill="#991800"/>

  <!-- West -->
  <line x1="164" y1="210" x2="98" y2="210" stroke="#771200" stroke-width="1.5"/>
  <rect x="84"  y="203" width="14" height="14" rx="1"
    fill="#3d0800" stroke="#771200" stroke-width="1.2"/>
  <circle cx="164" cy="210" r="2.5" fill="#991800"/>

  <!-- ── Diagonal accent lines (45°) ── -->
  <line x1="310" y1="152" x2="290" y2="172" stroke="#3d0700" stroke-width="1" opacity="0.8"/>
  <circle cx="310" cy="152" r="2" fill="#550a00" opacity="0.8"/>

  <line x1="190" y1="152" x2="210" y2="172" stroke="#3d0700" stroke-width="1" opacity="0.8"/>
  <circle cx="190" cy="152" r="2" fill="#550a00" opacity="0.8"/>

  <line x1="310" y1="268" x2="290" y2="248" stroke="#3d0700" stroke-width="1" opacity="0.8"/>
  <circle cx="310" cy="268" r="2" fill="#550a00" opacity="0.8"/>

  <line x1="190" y1="268" x2="210" y2="248" stroke="#3d0700" stroke-width="1" opacity="0.8"/>
  <circle cx="190" cy="268" r="2" fill="#550a00" opacity="0.8"/>

  <!-- ── EKG / Pulse waveform (glow layer) ── -->
  <polyline
    points="
      148,210  172,210  182,210
      190,183  198,237  206,183  214,237  222,210
      250,210
      278,183  286,237  294,183  302,237  310,210
      318,210  328,210  352,210"
    fill="none" stroke="#ff2200" stroke-width="4"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#g2)" opacity="0.55"/>

  <!-- EKG crisp line -->
  <polyline
    points="
      148,210  172,210  182,210
      190,183  198,237  206,183  214,237  222,210
      250,210
      278,183  286,237  294,183  302,237  310,210
      318,210  328,210  352,210"
    fill="none" stroke="#ff2200" stroke-width="1.6"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#g1)"/>

  <!-- ── LED layers (drawn OVER EKG so it sits on top) ── -->
  <!-- Outer ambient bloom -->
  <circle cx="250" cy="210" r="42" fill="#ff1100" filter="url(#g3)" opacity="0.18"/>
  <!-- Mid glow ring -->
  <circle cx="250" cy="210" r="28" fill="none"
    stroke="#ff2200" stroke-width="1" opacity="0.25"/>
  <!-- Soft halo fill -->
  <circle cx="250" cy="210" r="22" fill="#ff2200" opacity="0.14"/>
  <!-- Core sphere -->
  <circle cx="250" cy="210" r="14"
    fill="url(#led-sphere)" filter="url(#g2)"/>
  <!-- Specular highlight -->
  <ellipse cx="245.5" cy="204" rx="4.5" ry="3.5"
    fill="rgba(255,255,255,0.6)"/>
  <!-- Tiny center point -->
  <circle cx="250" cy="210" r="2" fill="rgba(255,255,255,0.4)"/>

  <!-- ── Corner brackets ── -->
  <path d="M62,62 L94,62 M62,62 L62,94"
    stroke="#1e0300" stroke-width="1.5" fill="none"/>
  <path d="M438,62 L406,62 M438,62 L438,94"
    stroke="#1e0300" stroke-width="1.5" fill="none"/>
  <path d="M62,385 L94,385 M62,385 L62,353"
    stroke="#1e0300" stroke-width="1.5" fill="none"/>
  <path d="M438,385 L406,385 M438,385 L438,353"
    stroke="#1e0300" stroke-width="1.5" fill="none"/>

  <!-- ── Separator ── -->
  <line x1="120" y1="372" x2="380" y2="372"
    stroke="#2a0400" stroke-width="0.7"/>
  <!-- separator dots -->
  <circle cx="116" cy="372" r="2" fill="#660c00" opacity="0.8"/>
  <circle cx="384" cy="372" r="2" fill="#660c00" opacity="0.8"/>

  <!-- ── Wordmark: PULSE (white, glowing) ── -->
  <text x="250" y="427"
    font-family="'Courier New', Courier, monospace"
    font-size="60" font-weight="bold"
    fill="url(#txt-white)"
    text-anchor="middle"
    letter-spacing="10"
    filter="url(#txt-glow)">PULSE</text>

  <!-- ── Wordmark: TECH (red) ── -->
  <text x="250" y="427"
    font-family="'Courier New', Courier, monospace"
    font-size="60" font-weight="bold"
    fill="none"
    text-anchor="middle"
    letter-spacing="10">PULSE</text>

  <!-- Red underline accent under PULSE -->
  <line x1="135" y1="432" x2="365" y2="432"
    stroke="#ff2200" stroke-width="0.8" opacity="0.5"/>

  <!-- ── TECH HUB subtitle ── -->
  <text x="250" y="463"
    font-family="'Courier New', Courier, monospace"
    font-size="18" font-weight="bold"
    fill="#ff2200"
    text-anchor="middle"
    letter-spacing="22"
    filter="url(#g1)">TECH HUB</text>

  <!-- Red LED dots flanking PULSE (like the album's LED) -->
  <circle cx="117" cy="413" r="3.5" fill="#ff2200" filter="url(#g1)"/>
  <circle cx="383" cy="413" r="3.5" fill="#ff2200" filter="url(#g1)"/>

  <!-- small binary-like accents near subtitle -->
  <text x="80" y="467"
    font-family="'Courier New', Courier, monospace"
    font-size="8" fill="#330500" opacity="0.7"
    letter-spacing="2">01 10</text>
  <text x="390" y="467"
    font-family="'Courier New', Courier, monospace"
    font-size="8" fill="#330500" opacity="0.7"
    letter-spacing="2">10 01</text>
</svg>
